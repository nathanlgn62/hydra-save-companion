name: Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "hydra-save-companion"
          env-slug: "dev"

      - name: Verify Infisical secrets
        shell: bash
        run: |
          echo "=== Verifying Infisical secrets injection ==="
          SECRETS=("STEAM_GRID_DB" "HSC_GC_ID" "HSC_GS" "HSC_DBX_ID" "HSC_DBX_SECRET" "HSC_PROTON_ID" "HSC_PROTON_SECRET" "TAURI_SIGNING_PRIVATE_KEY")
          for VAR in "${SECRETS[@]}"; do
            VAL="${!VAR}"
            if [ -n "$VAL" ]; then
              echo "✓ $VAR is loaded (${#VAL} chars)"
            else
              echo "⚠ Warning: $VAR is NOT defined in environment"
            fi
          done

      - name: Generate Changelog
        id: changelog
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="v$VERSION" \
            --jq .body 2>/dev/null || true)

          if [ -z "$NOTES" ]; then
            NOTES="Automated release for v$VERSION. See commit history for detailed changes."
          fi

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Verify signing key
        shell: bash
        env:
          KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "✓ TAURI_SIGNING_PRIVATE_KEY is loaded (${#KEY} chars)."
          else
            echo "::error ::TAURI_SIGNING_PRIVATE_KEY is missing! Make sure it is added in GitHub Secrets or Infisical."
            exit 1
          fi

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          STEAM_GRID_DB: ${{ env.STEAM_GRID_DB }}
          HSC_GC_ID: ${{ env.HSC_GC_ID }}
          HSC_GS: ${{ env.HSC_GS }}
          HSC_DBX_ID: ${{ env.HSC_DBX_ID }}
          HSC_DBX_SECRET: ${{ env.HSC_DBX_SECRET }}
          HSC_PROTON_ID: ${{ env.HSC_PROTON_ID }}
          HSC_PROTON_SECRET: ${{ env.HSC_PROTON_SECRET }}
        with:
          tagName: v__VERSION__
          releaseName: "Hydra Save Companion v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
